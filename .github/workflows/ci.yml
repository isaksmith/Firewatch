# Checks every push to main and every pull request, then pushes the backend to the API server if main changed it.
# The pages deploy through Vercel's own GitHub connection, which doesn't wait for these checks.
# Deploy settings: secret FW_SSH_KEY (a key in the server's ~/.ssh/authorized_keys), secret FW_KNOWN_HOSTS (the
# server's host key line) and variable FW_SERVER (ubuntu@<ip>). See deploy/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Runs on main finish, so a deploy is never cut off.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Console and viewer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npx vite build
      - run: node ../sensors/viewer/verify.mjs

  deploy:
    name: Deploy backend
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Did this push change the backend?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          paths="backend deploy/deploy.sh deploy/rsync-exclude deploy/firewatch.service deploy/Caddyfile"
          if [ "$GITHUB_EVENT_NAME" = push ] && git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null &&
             git diff --quiet "$BEFORE" HEAD -- $paths; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes; nothing to deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH access to the server
        if: steps.changed.outputs.deploy == 'true'
        env:
          KEY: ${{ secrets.FW_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FW_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        if: steps.changed.outputs.deploy == 'true'
        run: deploy/deploy.sh "${{ vars.FW_SERVER }}"
