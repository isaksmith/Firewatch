<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firewatch System Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one screen, top chapter bar, stage in the middle, step bar below. Tokens are the app's own (frontend/src/index.css). */
:root {
  color-scheme: dark;
  --void:#050607; --bg:#08090b; --panel:#0c0e11; --panel2:#121519; --raised:#181c21; --line:#1d2127; --line2:#2a3038;
  --text:#e6e8eb; --muted:#8b939d; --escalate:#ff4b2b; --investigate:#ffb21a; --monitor:#6b7684; --ok:#3ddc97; --degraded:#b18cff; --sample:#5cc8ff;
  --sans:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --xs:.875rem; --sm:.9375rem; --md:1rem; --lg:1.125rem; --xl:1.375rem; --xxl:1.875rem;
  font-size: clamp(16px, 1.25vw, 24px);
}
:root[data-theme="light"] {
  color-scheme: light;
  --void:#e7eaee; --bg:#f2f3f5; --panel:#fbfbfc; --panel2:#eceef1; --raised:#e2e5e9; --line:#d3d8de; --line2:#aeb6c0;
  --text:#14181d; --muted:#4e5761; --escalate:#ad2308; --investigate:#855600; --monitor:#55606c; --ok:#086547; --degraded:#6541bf; --sample:#0a6596;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: var(--md); line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--sample); outline-offset: 2px; }
code { font-family: var(--mono); font-size: .92em; }
::selection { background: rgb(92 200 255 / .3); }
* { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.label { font-family: var(--mono); font-size: var(--xs); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.top { display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.brand { font-family: var(--mono); font-weight: 600; letter-spacing: .14em; font-size: var(--xs); white-space: nowrap; }
.brand span { color: var(--escalate); }
.chapters { display: flex; gap: .15rem; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.chapters button { padding: .6rem .55rem; font-size: var(--xs); color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; }
.chapters button .num { margin-right: .3rem; }
.chapters button:hover { color: var(--text); }
.chapters button[aria-current="true"] { color: var(--text); border-bottom-color: var(--escalate); }
.btn { display: inline-flex; align-items: center; gap: .4rem; min-height: 2rem; padding: 0 .7rem; border: 1px solid var(--line2); font-family: var(--mono); font-size: var(--xs); font-weight: 500; letter-spacing: .05em; color: var(--text); background: var(--panel2); white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { border-color: var(--text); }
.bottom { display: flex; align-items: center; gap: .75rem; border-top: 1px solid var(--line); background: var(--panel); padding-block: .45rem; min-width: 0; }
.bottom .where { flex: 1; min-width: 0; display: flex; align-items: center; gap: .75rem; color: var(--muted); font-size: var(--xs); font-family: var(--mono); }
.ticks { display: flex; gap: 3px; }
.ticks i { width: 1.1rem; height: .3rem; background: var(--line2); display: block; }
.ticks i.on { background: var(--escalate); }
.keys { color: var(--muted); font-family: var(--mono); font-size: var(--xs); white-space: nowrap; }

main { overflow: auto; min-height: 0; background: var(--bg); }
.view { padding-block: 1.1rem; max-width: 84rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; min-height: 100%; }
.view.full { max-width: none; padding-block: .7rem; height: 100%; min-height: 0; }
.view h1 { font-size: var(--xxl); line-height: 1.15; letter-spacing: -.01em; }
.lede { font-size: var(--lg); color: var(--muted); max-width: 46rem; }

.chip { display: inline-block; font-family: var(--mono); font-size: var(--xs); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; line-height: 1.3; padding: 0 .3rem; border: 1px solid currentColor; white-space: nowrap; }
.chip.live { color: var(--ok); } .chip.sim { color: var(--sample); }
.chip.building { color: var(--degraded); border-style: dashed; }
.chip.planned { color: var(--muted); border-style: dotted; }
.chip.assumed { color: var(--investigate); border-style: dashed; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; font-size: var(--xs); color: var(--muted); }
.legend li { display: flex; gap: .4rem; align-items: center; }

/* The gap */
.bar { position: relative; display: flex; height: 4.6rem; border: 1px solid var(--line2); }
.seg { display: flex; flex-direction: column; justify-content: center; padding: 0 .6rem; min-width: 0; overflow: hidden; }
.seg b { font-family: var(--mono); font-size: var(--xl); font-weight: 600; line-height: 1.1; white-space: nowrap; }
.seg span { font-size: var(--xs); white-space: nowrap; }
.seg.escalate { background: color-mix(in srgb, var(--escalate) 20%, var(--panel)); }
.seg.escalate b { color: var(--escalate); }
.seg.investigate { background: color-mix(in srgb, var(--investigate) 18%, var(--panel)); padding: 0 .3rem; }
.seg.investigate b { color: var(--investigate); font-size: var(--md); }
.seg.investigate span { white-space: normal; line-height: 1.1; }
.seg.sample { background: color-mix(in srgb, var(--sample) 13%, var(--panel)); }
.seg.sample b { color: var(--sample); }
.clocks { position: relative; height: 1.5rem; }
.clocks span { position: absolute; transform: translateX(-50%); font-family: var(--mono); font-size: var(--xs); color: var(--muted); }
.clocks span:first-child { transform: none; } .clocks span:last-child { transform: translateX(-100%); }
.marks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .9rem; }
.marks b { display: block; font-family: var(--mono); font-size: var(--lg); font-weight: 600; }
.marks p { font-size: var(--sm); color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .9rem; border-top: 1px solid var(--line); padding-top: .8rem; }
.facts p { font-size: var(--sm); }
.close { font-size: var(--lg); max-width: 52rem; }

/* Stage */
.split { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 1rem; flex: 1; min-height: 0; }
.stagewrap { display: flex; flex-direction: column; gap: .5rem; min-height: 0; min-width: 0; }
.levels { display: flex; align-items: center; gap: 1rem; font-family: var(--mono); font-size: var(--xs); color: var(--muted); }
.levels span.on { color: var(--text); font-weight: 600; }
.levels span.on.escalate { color: var(--escalate); } .levels span.on.investigate { color: var(--investigate); }
.stage { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 2.6rem minmax(0, 1fr) 2.6rem minmax(0, 1fr) 1.9rem; grid-template-rows: auto repeat(5, minmax(0, 1fr)) auto; row-gap: .85rem; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke: var(--line2); stroke-width: 1.5; }
.wire.dash { stroke-dasharray: 5 5; }
.head { fill: var(--line2); }
.lit-escalate { --tone: var(--escalate); } .lit-investigate { --tone: var(--investigate); } .lit-sample { --tone: var(--sample); } .lit-degraded { --tone: var(--degraded); }
.wire.on { stroke: var(--tone); stroke-width: 2.25; stroke-dasharray: 7 6; animation: flow .8s linear infinite; }
.head.on { fill: var(--tone); }
@keyframes flow { to { stroke-dashoffset: -13; } }
.colhead { align-self: end; }
.box { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; gap: .05rem; text-align: left; padding: .3rem .5rem; background: var(--panel); border: 1px solid var(--line2); min-height: 0; min-width: 0; overflow: hidden; transition: background-color .25s, border-color .25s; }
.box .bt { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 .4rem; }
.box b { font-size: var(--sm); font-weight: 600; line-height: 1.25; }
.box small { font-size: var(--xs); color: var(--muted); line-height: 1.25; }
.box:hover { background: var(--panel2); }
.box.seen { border-color: var(--muted); }
.box.on { border-color: var(--tone); background: color-mix(in srgb, var(--tone) 15%, var(--panel)); box-shadow: inset 0 0 0 1px var(--tone); }
.box.on small { color: var(--text); }
.box.sel { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); background: var(--raised); }
.walkmode .box { cursor: default; }
.rails { grid-column: 1 / 6; display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
.rails .box { border-style: dashed; }

/* Script panel */
.script { display: flex; flex-direction: column; gap: .5rem; overflow: auto; min-height: 0; padding-right: .3rem; }
.clock { display: flex; align-items: baseline; gap: .6rem; font-family: var(--mono); }
.clock b { font-size: var(--xxl); font-weight: 600; line-height: 1.1; }
.clock span { color: var(--muted); font-size: var(--sm); }
.chips { display: flex; gap: .35rem; flex-wrap: wrap; }
.script h2 { font-size: var(--xl); line-height: 1.2; }
.say { font-size: var(--lg); line-height: 1.4; }
.msg { border-top: 1px solid var(--line2); padding-top: .3rem; }
.msg header { display: flex; justify-content: space-between; gap: .6rem; font-family: var(--mono); font-size: var(--xs); color: var(--muted); }
.msg p { font-family: var(--mono); font-size: var(--xs); line-height: 1.4; overflow-wrap: anywhere; }
.msg.in p { color: var(--investigate); font-weight: 600; }
.opts { border-top: 1px solid var(--line2); padding-top: .3rem; font-size: var(--xs); }
.opts li { display: flex; justify-content: space-between; gap: .75rem; color: var(--muted); }
.opts li.rec { color: var(--text); font-weight: 600; }
.note { font-size: var(--xs); color: var(--muted); }
.note.warn { color: var(--text); border-left: 2px solid var(--investigate); padding-left: .5rem; }
.today { background: var(--panel2); padding: .35rem .5rem; font-size: var(--sm); }
.today .label { display: block; }
.src { font-family: var(--mono); font-size: var(--xs); color: var(--muted); }

/* Detail panel */
.detail { display: flex; flex-direction: column; gap: .6rem; overflow: auto; min-height: 0; padding-right: .3rem; }
.detail h2 { font-size: var(--xl); line-height: 1.2; }
.detail .plain { font-size: var(--lg); line-height: 1.4; }
.detail ul { display: flex; flex-direction: column; gap: .3rem; font-size: var(--sm); }
.detail li { padding-left: .8rem; position: relative; }
.detail li::before { content: ''; position: absolute; left: 0; top: .6em; width: .3rem; height: 1px; background: var(--muted); }
.detail img { width: 100%; border: 1px solid var(--line2); display: block; }
.detail figcaption { font-size: var(--xs); color: var(--muted); }
.detail figure { margin: 0; display: flex; flex-direction: column; gap: .2rem; }
.linkbtn { align-self: flex-start; }

/* With and without */
.chart { overflow-x: auto; }
.chart-in { min-width: 44rem; display: grid; gap: .35rem; }
.crow { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: .75rem; align-items: center; }
.crow .who b { display: block; font-size: var(--md); font-weight: 600; }
.crow .who small { display: block; font-size: var(--xs); color: var(--muted); }
.crow .who .chips { margin-top: .1rem; }
.track { position: relative; height: 2.7rem; }
.lane { position: absolute; left: 0; right: 0; bottom: 0; height: 1.25rem; display: flex; background: var(--panel); }
.lane i { display: block; height: 100%; }
.lane .dark { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--escalate) 38%, var(--panel)) 0 5px, color-mix(in srgb, var(--escalate) 14%, var(--panel)) 5px 10px); }
.lane .known { background: color-mix(in srgb, var(--investigate) 34%, var(--panel)); }
.lane .moving { background: color-mix(in srgb, var(--sample) 26%, var(--panel)); }
.mark { position: absolute; bottom: 0; height: 2rem; width: 1px; background: var(--text); }
.mark span { position: absolute; top: -.2rem; font-family: var(--mono); font-size: var(--xs); font-weight: 600; line-height: 1; }
.mark.r span { left: .2rem; } .mark.l span { right: .2rem; }
.axis { position: relative; height: 1.3rem; margin-left: 11.75rem; }
.axis span { position: absolute; transform: translateX(-50%); font-family: var(--mono); font-size: var(--xs); color: var(--muted); }
.axis span:first-child { transform: none; }
.key { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; font-size: var(--xs); color: var(--muted); }
.key li { display: flex; align-items: center; gap: .35rem; }
.key i { width: 1.2rem; height: .75rem; display: block; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--sm); }
th { text-align: left; font-family: var(--mono); font-size: var(--xs); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: .25rem .6rem .25rem 0; border-bottom: 1px solid var(--line2); }
td { padding: .3rem .6rem .3rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.callout { font-size: var(--lg); border-left: 3px solid var(--escalate); padding-left: .7rem; max-width: 56rem; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .4rem 1.25rem; font-size: var(--xs); color: var(--muted); }

/* Rules */
.rules { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
.presets { display: flex; flex-wrap: wrap; gap: .3rem; }
.ctl { display: grid; grid-template-columns: 13rem minmax(0, 1fr); gap: .5rem; align-items: center; padding: .17rem 0; border-bottom: 1px solid var(--line); }
.ctl > span { font-size: var(--sm); }
.seg-btns { display: flex; flex-wrap: wrap; gap: .2rem; }
.seg-btns button { font-family: var(--mono); font-size: var(--xs); padding: .1rem .45rem; border: 1px solid var(--line2); color: var(--muted); background: var(--panel); }
.seg-btns button:hover { color: var(--text); }
.seg-btns button[aria-pressed="true"] { color: var(--bg); background: var(--text); border-color: var(--text); font-weight: 600; }
.verdict { padding: .9rem; border: 1px solid var(--tone, var(--line2)); background: color-mix(in srgb, var(--tone, var(--monitor)) 12%, var(--panel)); display: flex; flex-direction: column; gap: .5rem; position: sticky; top: 0; }
.verdict.escalate { --tone: var(--escalate); } .verdict.investigate { --tone: var(--investigate); } .verdict.monitor { --tone: var(--monitor); }
.verdict .big { font-family: var(--mono); font-size: var(--xxl); font-weight: 600; color: var(--tone); line-height: 1.1; }
.verdict.monitor .big { color: var(--text); }
.verdict .out { font-size: var(--lg); }
.verdict li { font-size: var(--sm); color: var(--muted); }

/* Board */
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .9rem; }
.flow li { position: relative; padding: .45rem .55rem; border: 1px solid var(--line2); background: var(--panel); }
.flow li:not(:last-child)::after { content: '→'; position: absolute; right: -.85rem; top: 40%; color: var(--muted); font-family: var(--mono); }
.flow b { display: block; font-size: var(--sm); }
.flow span { font-size: var(--xs); color: var(--muted); display: block; line-height: 1.3; }
.four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
.four h3 { font-size: var(--sm); } .four p { font-size: var(--xs); color: var(--muted); }

/* Field */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: .9rem; }
.card { padding: .7rem .8rem; background: var(--panel); border: 1px solid var(--line2); display: flex; flex-direction: column; gap: .4rem; }
.card header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.card h2 { font-size: var(--lg); }
.card p { font-size: var(--sm); }
.card .gapline { color: var(--muted); border-top: 1px solid var(--line); padding-top: .35rem; }
.card .gapline b { color: var(--investigate); font-family: var(--mono); font-size: var(--xs); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; display: block; }

/* Numbers */
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
.cols section { display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .75rem; font-size: var(--sm); }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: var(--xs); text-align: right; align-self: center; }
.kv.wide { grid-template-columns: 1fr; } .kv.wide dd { font-family: var(--sans); font-size: var(--sm); text-align: left; margin-bottom: .3rem; }
.hbar { display: grid; grid-template-columns: 6rem minmax(0, 1fr); gap: .5rem; align-items: center; font-size: var(--sm); }
.hbar i { display: block; height: .9rem; background: var(--sample); }
.hbar div { display: flex; align-items: center; gap: .4rem; }
.statuses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .15rem 1.25rem; font-size: var(--sm); }
.statuses li { display: flex; justify-content: space-between; gap: .5rem; align-items: center; border-bottom: 1px solid var(--line); padding: .15rem 0; }

@media (max-width: 1160px) {
  .keys { display: none; }
  .split, .rules, .cols { grid-template-columns: minmax(0, 1fr); }
  .view.full { height: auto; min-height: 100%; }
  .script, .detail { overflow: visible; }
  .stage { display: flex; flex-direction: column; gap: .4rem; }
  .wires { display: none; }
  .rails { display: flex; flex-direction: column; gap: .4rem; }
  .box { min-height: 3.6rem; }
  .walkmode .box:not(.on), .walkmode .colhead, .walkmode .rails:not(:has(.on)) { display: none; }
  .split.walk .script { order: -1; }
  .marks, .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .clocks { display: none; }
  .notes, .four, .statuses { grid-template-columns: minmax(0, 1fr); }
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .flow li::after { display: none; }
  .ctl { grid-template-columns: minmax(0, 1fr); gap: .15rem; }
  .verdict { position: static; order: -1; }
  .seg span { display: none; }
}
@media (max-width: 480px) {
  .ticks { display: none; }
  .where span { white-space: nowrap; }
  .seg.investigate { padding: 0; }
  .seg.investigate b { font-size: var(--xs); letter-spacing: -.02em; }
}
@media (prefers-reduced-motion: reduce) {
  .wire.on { animation: none; stroke-dasharray: none; }
  .box { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top gut">
    <div class="brand">FIRE<span>WATCH</span></div>
    <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
    <button class="btn" id="theme" type="button" aria-label="Switch between light and dark">L</button>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="bottom gut">
    <button class="btn" id="back" type="button">← Back</button>
    <div class="where" id="where"></div>
    <span class="keys">← → move, 1 to 8 chapters, L theme</span>
    <button class="btn primary" id="next" type="button">Next →</button>
  </footer>
</div>
<script>
/* ------------------------------------------------------------------------------------------------
   SYSTEM: every word and number on this page. Edit here. Flip a box's `status` when a piece lands.
   status: live | sim | building | planned.  Numbers come from the replays and reports named beside them.
   ------------------------------------------------------------------------------------------------ */
const SYSTEM = {
  source: {
    ring: 'Replay: ring-on, no Red Flag, scratch merge of michael eeb3517 and michael-board cb368e2',
    walk: 'Replay: ring-on ignition, Red Flag on, assumed PAGE at 2 and SEND at 5, same scratch merge',
    andrew: "Andrew's replay on the andrew branch, Coldwater ignition"
  },

  status: {
    live: { label: 'Live', means: 'Runs on real data today' },
    sim: { label: 'Simulated', means: 'Built, only run in replay or against fakes' },
    building: { label: 'Building', means: 'Community board work under way' },
    planned: { label: 'Planned', means: 'Documented only' },
    assumed: { label: 'Assumed', means: "A person's reply we wrote for the story" }
  },

  chapters: [
    { id: 'gap', name: 'The gap' },
    { id: 'walk', name: 'Walk the fire' },
    { id: 'compare', name: 'With and without' },
    { id: 'map', name: 'The map' },
    { id: 'rules', name: 'Try the rules' },
    { id: 'board', name: 'Community board' },
    { id: 'field', name: 'Field reality' },
    { id: 'numbers', name: 'Honest numbers' }
  ],

  gap: {
    head: '62 minutes to first truck. 27 with nobody knowing.',
    intro: 'Cottonwood Creek Fire District, a red flag Tuesday in mid March. South wind 30 to 40 mph, gusts past 55, humidity 11%, five weeks without rain.',

/* decide-level:start  JS port of decide_level in backend/app/confirm.py. Parity-tested against the Python. */
function decideLevel(s) {
  // s.sat: none | monitor | investigate | escalate (the satellite's own recommendation after guardrails)
  // s.ngfs: a qualifying NOAA NGFS signal
  // s.line: none | trip | town | lockout     s.gfdi: number     s.redFlag: NWS Red Flag Warning here (event inside the district)
  // s.reports: registered FIRE reports, each a different person     s.replies: neighbors replying 1, none of them the burner
  // s.strangers: unregistered reports        s.sensors: smoke sensors firing     s.reply3: someone replied 3, my burn
  // s.burn: none | inside | outside | late (registered burn here today; late means sent after the event started)
  const MIN_GFDI = 12, EXTREME_GFDI = 25;
  const labels = [];
  let strong = false, redFlagFault = false;
  if (s.sat === 'escalate' || s.sat === 'investigate') {
    labels.push('satellite detection');
    strong = s.sat === 'escalate';
  }
  if (s.ngfs && !labels.includes('satellite detection')) labels.push('NGFS beta detection'); // same source class as a satellite, never strong
  if (s.line === 'lockout' && s.gfdi >= MIN_GFDI) {
    labels.push('power line lockout');
    if (s.redFlag) redFlagFault = true;
  }
  for (let i = 0; i < s.reports; i++) labels.push('report from a registered person');
  for (let i = 0; i < s.replies; i++) labels.push('a neighbor sees smoke');
  if (s.sensors > 0) labels.push('smoke sensor');
  const weak = s.strangers > 0;

  const hasBurn = s.burn !== 'none', late = s.burn === 'late';
  const escaped = [];
  if (hasBurn) {
    if (s.burn === 'outside') escaped.push('fire seen more than 1 km outside the notice');
    if (s.reports > 0 || s.strangers > 0) escaped.push('a text report of fire');
    if (s.replies > 0) escaped.push('a neighbor sees smoke');
  }
  const n = labels.length;
  if (hasBurn && !late && escaped.length === 0) {
    if (!(s.redFlag || s.gfdi >= EXTREME_GFDI)) {
      return { level: 'monitor', reason: 'Registered burn, inside its notice and not escaped.', escaped };
    }
    return { level: 'investigate', reason: 'Registered burn with no sign it escaped, on an extreme day. One quiet look, never a page request.', escaped };
  }
  let level, reason;
  if (redFlagFault) {
    level = 'escalate';
    reason = 'line fault on a Red Flag day';
  } else if (strong || n >= 2) {
    level = 'escalate';
    reason = n >= 2 ? labels.join(' + ') : 'strong satellite detection';
  } else if (n === 1 || weak) {
    level = 'investigate';
    reason = (n ? labels[0] : 'unregistered report') + ', needs a second source';
  } else {
    level = s.sat === 'none' ? 'monitor' : s.sat;
    reason = 'no qualifying signal';
  }
  if (late && level === 'escalate' && escaped.length === 0) {
    level = 'investigate';
    reason = 'a burn notice sent after this started is a claim, check before paging';
  } else if (s.reply3 && level === 'escalate' && escaped.length === 0) {
    level = 'investigate';
    reason = 'someone says it is their burn (unregistered), check before paging';
  }
  return { level, reason, escaped };
}
/* decide-level:end */

const GLYPH = { escalate: '◆', investigate: '◇', monitor: '□' };
const NAME = { escalate: 'Escalate', investigate: 'Investigate', monitor: 'Monitor' };
const state = { ch: 'gap', step: 0, node: 'rule', rules: { ...SYSTEM.rules.base, ...SYSTEM.rules.presets[0].set } };
const chip = (k) => `<span class="chip ${k}">${SYSTEM.status[k].label}</span>`;

/* ---- The stage: boxes in a grid, wires drawn from their measured positions ---- */
function boxHTML(id, n) {
  const pos = n.rail ? '' : `style="grid-column:${n.col * 2 - 1};grid-row:${n.row + 1}"`;
  return `<button class="box" type="button" data-id="${id}" ${pos}><span class="bt"><b>${n.title}</b>${chip(n.status)}</span><small>${n.sub}</small></button>`;
}
function stageHTML(mode) {
  const N = SYSTEM.nodes, ids = Object.keys(N);
  return `<div class="stage ${mode}" id="stage"><svg class="wires" id="wires" aria-hidden="true"></svg>
    <div class="colhead label" style="grid-column:1;grid-row:1">Detect</div>
    <div class="colhead label" style="grid-column:3;grid-row:1">Confirm</div>
    <div class="colhead label" style="grid-column:5;grid-row:1">Respond</div>
    ${ids.filter((i) => !N[i].rail).map((i) => boxHTML(i, N[i])).join('')}
    <div class="rails" style="grid-row:7">${ids.filter((i) => N[i].rail).map((i) => boxHTML(i, N[i])).join('')}</div>
  </div>`;
}
function drawWires() {
  const st = $('#stage'), svg = $('#wires');
  if (!st || !svg || getComputedStyle(svg).display === 'none') return;
  const R = st.getBoundingClientRect();
  const box = (id) => { const r = $(`.box[data-id="${id}"]`).getBoundingClientRect(); return { l: r.left - R.left, r: r.right - R.left, t: r.top - R.top, b: r.bottom - R.top, x: (r.left + r.right) / 2 - R.left, y: (r.top + r.bottom) / 2 - R.top }; };
  svg.setAttribute('viewBox', `0 0 ${R.width} ${R.height}`);
  const A = 6;
  svg.innerHTML = SYSTEM.edges.map((e) => {
    const f = box(e.from), t = box(e.to);
    let d, head;
    if (e.route === 'v') {
      const up = t.t < f.t, x = f.x + (e.dx || 0), y1 = up ? f.t : f.b, y2 = up ? t.b : t.t;
      d = `M${x} ${y1}V${y2 + (up ? A : -A)}`;
      head = up ? `${x},${y2} ${x - A * .7},${y2 + A} ${x + A * .7},${y2 + A}` : `${x},${y2} ${x - A * .7},${y2 - A} ${x + A * .7},${y2 - A}`;
    } else if (e.route === 'side') {
      const x = f.r + e.off, y2 = t.y + e.dy;
      d = `M${f.r} ${f.y}H${x}V${y2}H${t.r + A}`;
      head = `${t.r},${y2} ${t.r + A},${y2 - A * .7} ${t.r + A},${y2 + A * .7}`;
    } else {
      const mid = (f.r + t.l) / 2;
      d = e.route === 'h' ? `M${f.r} ${f.y}H${t.l - A}` : `M${f.r} ${f.y}H${mid}V${t.y}H${t.l - A}`;
      head = `${t.l},${t.y} ${t.l - A},${t.y - A * .7} ${t.l - A},${t.y + A * .7}`;
    }
    return `<path class="wire ${e.dashed ? 'dash' : ''}" data-e="${e.id}" d="${d}"/><polygon class="head" data-e="${e.id}" points="${head}"/>`;
  }).join('');
  if (state.ch === 'walk') paintStep();
}
function paintStep() {
  const s = SYSTEM.steps[state.step], st = $('#stage');
  st.className = `stage walkmode lit-${s.tone === 'sample' ? 'sample' : s.tone}`;
  const seen = new Set(SYSTEM.steps.slice(0, state.step).flatMap((x) => x.nodes));
  document.querySelectorAll('.box').forEach((b) => {
    b.classList.toggle('on', s.nodes.includes(b.dataset.id));
    b.classList.toggle('seen', seen.has(b.dataset.id));
  });
  document.querySelectorAll('[data-e]').forEach((w) => {
    const on = s.edges.includes(w.dataset.e);
    w.classList.toggle('on', on);
    if (on) w.parentNode.appendChild(w);
  });
  $('#levels').innerHTML = ['monitor', 'investigate', 'escalate'].map((l) => `<span class="${s.level === l ? 'on ' + l : ''}">${GLYPH[l]} ${NAME[l]}</span>`).join('');
}

    </div></div>
    <ul class="key"><li><i class="lane-k dark" style="background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--escalate) 38%,var(--panel)) 0 5px,color-mix(in srgb,var(--escalate) 14%,var(--panel)) 5px 10px)"></i>Nobody knows</li><li><i style="background:color-mix(in srgb,var(--investigate) 34%,var(--panel))"></i>Someone knows, no page</li><li><i style="background:color-mix(in srgb,var(--sample) 26%,var(--panel))"></i>Paged, first truck on the way</li><li>Minutes after 1:50 pm</li></ul>
    <p class="callout">${c.say}</p>
    <div class="tablewrap"><table><thead><tr><th>Scenario</th><th>First alert</th><th>Escalate</th><th>Page</th><th>On scene</th><th>Needs</th></tr></thead>
      <tbody>${c.rows.map((r) => `<tr><td>${r.name}</td>${r.cells.map((x) => `<td class="n">${x}</td>`).join('')}<td>${r.needs}</td></tr>`).join('')}</tbody></table></div>
    <div class="notes">${c.notes.map((n) => `<p>${n}</p>`).join('')}</div>
  </div>`;
}
function mapView() {
  return `<div class="view full gut"><div class="split">
    <div class="stagewrap">${legend()}${stageHTML('')}</div>
    <div class="detail" id="detail"></div>
  </div></div>`;
}
function detailHTML(id) {
  const n = SYSTEM.nodes[id], img = n.shot && window.ASSETS && ASSETS[n.shot];
  const list = (a) => `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  return `<div class="chips">${chip(n.status)}</div><h2>${n.title}</h2><p class="plain">${esc(n.plain)}</p>
    <div class="label">The rule</div>${list(n.rules)}
    <div class="label">The numbers</div>${list(n.numbers)}
    ${img ? `<figure><img src="${img}" alt="${esc(n.shotAlt)}"><figcaption>${esc(n.shotAlt)}</figcaption></figure>` : ''}
    <div class="label">The code</div><p class="src">${esc(n.code)}</p><p class="src">Lives on: ${esc(n.branch)}</p>
    ${n.goto ? `<button class="btn linkbtn" type="button" data-goto="${n.goto}">Open ${SYSTEM.chapters.find((c) => c.id === n.goto).name} →</button>` : ''}`;
}
function paintMap() {
  document.querySelectorAll('.box').forEach((b) => b.classList.toggle('sel', b.dataset.id === state.node));
  $('#detail').innerHTML = detailHTML(state.node);
  $('#detail').scrollTop = 0;
}
function whyNot(s) {
  const out = [];
  if (s.line === 'trip') out.push('Line fault not counted: momentary trip, not a lockout.');
  if (s.line === 'town') out.push('Line fault not counted: in town.');
  if (s.line === 'lockout' && s.gfdi < 12) out.push('Line fault not counted: fire danger under GFDI 12.');
  if (s.redFlag && s.line !== 'lockout') out.push('Red Flag alone does nothing. It needs a rural lockout.');
  if (s.redFlag && s.line === 'lockout' && s.gfdi >= 12 && s.burn === 'inside' && s.reports + s.strangers + s.replies === 0) out.push('A registered burn with no evidence of escape holds this at Investigate.');
  if (s.sat === 'monitor') out.push('Satellite not counted: score under 40.');
  if (s.strangers > 0) out.push('Strangers are weak: they reach Investigate, never Escalate.');
  if (s.sensors > 1) out.push('All smoke sensors together count as one source.');
  return out;
}
function rulesView() {
  const r = SYSTEM.rules;
  return `<div class="view gut"><h1>${r.head}</h1><p class="lede">${r.intro}</p>
    <div class="presets">${r.presets.map((p, i) => `<button class="btn" type="button" data-preset="${i}">${p.name}</button>`).join('')}</div>
    <div class="rules"><div>${r.controls.map((c) => `<div class="ctl"><span>${c.label}</span><div class="seg-btns">${c.opts.map(([v, l]) => `<button type="button" data-k="${c.k}" data-v='${JSON.stringify(v)}'>${l}</button>`).join('')}</div></div>`).join('')}</div>
    <div class="verdict" id="verdict" aria-live="polite"></div></div>
    <p class="note">${r.foot}</p>
  </div>`;
}
function paintRules() {
  const s = state.rules, d = decideLevel(s);
  document.querySelectorAll('[data-k]').forEach((b) => b.setAttribute('aria-pressed', String(JSON.parse(b.dataset.v) === s[b.dataset.k])));
  const v = $('#verdict');
  v.className = `verdict ${d.level}`;
  const notes = [...d.escaped.map((e) => `Burn counts as escaped: ${e}.`), ...whyNot(s)];
  v.innerHTML = `<div class="big">${GLYPH[d.level]} ${NAME[d.level]}</div><p class="out">${SYSTEM.rules.outcome[d.level]}</p><p>${esc(d.reason)}</p>${notes.length ? `<ul>${notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}`;
}
function boardView() {
  const b = SYSTEM.board;
  return `<div class="view gut"><div class="chips">${chip('building')}</div><h1>${b.head}</h1><p class="lede">${b.intro}</p>
    <ol class="flow">${b.flow.map(([t, d]) => `<li><b>${t}</b><span>${d}</span></li>`).join('')}</ol>
    <div class="tablewrap"><table><thead><tr>${b.table.head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="four">${b.notes.map(([t, d]) => `<div><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>
    <p class="note warn">${b.built}</p><p class="note warn">${b.limit}</p>
  </div>`;
}
function fieldView() {
  const f = SYSTEM.field;
  return `<div class="view gut"><h1>${f.head}</h1><div class="cards">${f.cards.map((c) => `<section class="card"><header><h2>${c.title}</h2>${chip(c.status)}</header><p>${c.does}</p><p class="gapline"><b>Not proven</b>${c.gap}</p></section>`).join('')}</div></div>`;
}
function numbersView() {
  const n = SYSTEM.numbers, max = Math.max(...n.load.rows.map((r) => r[1]));
  const kv = (rows) => `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  const nodes = SYSTEM.nodes;
  return `<div class="view gut"><h1>${n.head}</h1><div class="cols">
    <section><div class="label">Cost</div>${kv(n.cost)}<p class="note">${n.costNote}</p><div class="label">Who pays</div><p class="note">${n.pays}</p></section>
    <section><div class="label">Time to stand up</div>${kv(n.phases)}<div class="label">${n.load.head}</div>
      ${n.load.rows.map(([k, v]) => `<div class="hbar"><span>${k}</span><div><i style="width:${(v / max) * 80}%"></i><span class="num">${v}</span></div></div>`).join('')}<p class="note">${n.load.note}</p></section>
    <section><div class="label">What the evidence shows</div><dl class="kv wide">${n.evidence.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></section>
    </div>
    <div class="label">Status of every piece</div><ul class="statuses">${Object.keys(nodes).map((i) => `<li><span>${nodes[i].title}</span>${chip(nodes[i].status)}</li>`).join('')}</ul>
    <div class="label">Where each piece lives</div><div class="tablewrap"><table><thead><tr>${n.branches.head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${n.branches.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="note warn">${n.branches.note}</p>
    <div class="label">Next step</div><p class="close">${n.next}</p>
  </div>`;
}
const VIEWS = { gap: gapView, walk: walkView, compare: compareView, map: mapView, rules: rulesView, board: boardView, field: fieldView, numbers: numbersView };

/* ---- Navigation ---- */
function paintChrome() {
  const i = chIndex(), last = SYSTEM.chapters.length - 1, inWalk = state.ch === 'walk', steps = SYSTEM.steps.length;
  document.querySelectorAll('#chapters button').forEach((b, k) => b.setAttribute('aria-current', String(k === i)));
  const cur = document.querySelector('#chapters button[aria-current="true"]');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('#where').innerHTML = inWalk
    ? `<span>Step ${state.step + 1} of ${steps}</span><span class="ticks">${SYSTEM.steps.map((_, k) => `<i class="${k <= state.step ? 'on' : ''}"></i>`).join('')}</span>`
    : `<span>Chapter ${i + 1} of ${last + 1}</span>`;
  $('#back').disabled = i === 0;
  $('#next').disabled = i === last;
  $('#next').textContent = inWalk && state.step < steps - 1 ? 'Next step →' : i < last ? `${SYSTEM.chapters[i + 1].name} →` : 'End';
}
function paintWalkStep() {
  $('#script').innerHTML = scriptHTML(SYSTEM.steps[state.step]);
  $('#script').scrollTop = 0;
  paintStep();
  paintChrome();
}
function render() {
  $('#main').innerHTML = VIEWS[state.ch]();
  $('#main').scrollTop = 0;
  if (state.ch === 'walk') { $('#script').innerHTML = scriptHTML(SYSTEM.steps[state.step]); drawWires(); paintStep(); }
  if (state.ch === 'map') { drawWires(); paintMap(); }
  if (state.ch === 'rules') paintRules();
  paintChrome();
}
function go(ch, step) {
  state.ch = ch;
  state.step = step || 0;
  if (location.hash.slice(1) !== ch) { try { history.replaceState(null, '', '#' + ch); } catch (e) { location.hash = ch; } }
  render();
}
function next() {
  if (state.ch === 'walk' && state.step < SYSTEM.steps.length - 1) { state.step++; paintWalkStep(); return; }
  const i = chIndex();
  if (i < SYSTEM.chapters.length - 1) go(SYSTEM.chapters[i + 1].id);
}
function back() {
  if (state.ch === 'walk' && state.step > 0) { state.step--; paintWalkStep(); return; }
  const i = chIndex();
  if (i > 0) { const p = SYSTEM.chapters[i - 1].id; go(p, p === 'walk' ? SYSTEM.steps.length - 1 : 0); }
}
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#theme').textContent = t === 'dark' ? 'L  Light' : 'L  Dark';
  try { localStorage.setItem('fw-theme', t); } catch (e) { /* storage can be blocked */ }
}
function toggleTheme() { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }

function boot() {
  $('#chapters').innerHTML = SYSTEM.chapters.map((c, i) => `<button type="button" data-ch="${c.id}"><span class="num">${i + 1}</span>${c.name}</button>`).join('');
  let saved = null;
  try { saved = localStorage.getItem('fw-theme'); } catch (e) { /* storage can be blocked */ }
  setTheme(saved === 'light' ? 'light' : 'dark');
  $('#next').addEventListener('click', next);
  $('#back').addEventListener('click', back);
  $('#theme').addEventListener('click', toggleTheme);
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-ch],[data-goto],[data-preset],[data-k],.box');
    if (!t) return;
    if (t.dataset.ch) go(t.dataset.ch);
    else if (t.dataset.goto) go(t.dataset.goto);
    else if (t.dataset.preset) { state.rules = { ...SYSTEM.rules.base, ...SYSTEM.rules.presets[+t.dataset.preset].set }; paintRules(); }
    else if (t.dataset.k) { state.rules[t.dataset.k] = JSON.parse(t.dataset.v); paintRules(); }
    else if (state.ch === 'map') {
      state.node = t.dataset.id; paintMap();
      if (window.innerWidth <= 1160) $('#detail').scrollIntoView({ block: 'start' });
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const onControl = e.target.closest && e.target.closest('button,a,input,select,textarea');
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !onControl)) { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
    else if (e.key === 'l' || e.key === 'L') toggleTheme();
    else if (/^[1-8]$/.test(e.key)) go(SYSTEM.chapters[+e.key - 1].id);
  });
  window.addEventListener('hashchange', () => {
    const h = location.hash.slice(1);
    if (VIEWS[h] && h !== state.ch) go(h);
  });
  let raf = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { if (state.ch === 'walk' || state.ch === 'map') { drawWires(); if (state.ch === 'map') paintMap(); } }); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state.ch === 'walk' || state.ch === 'map') drawWires(); });
  const h = location.hash.slice(1);
  go(VIEWS[h] ? h : 'gap');
}

</script>
